name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        flags: ["-DCMAKE_BUILD_TYPE=Release", "-DCMAKE_BUILD_TYPE=Debug -DDDP_SANITIZE=ON"]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libeigen3-dev libgtest-dev
      - run: cmake -S . -B build -G Ninja ${{ matrix.flags }}
      - run: cmake --build build
      - run: cd build && ctest --output-on-failure
  crosscheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # a managed interpreter: Ubuntu 24.04's system pip refuses installs (PEP 668)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libeigen3-dev libgtest-dev
      - run: pip install casadi pandas matplotlib scipy
      - run: ./scripts/run_all.sh
